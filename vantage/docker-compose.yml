services:
  postgres:
    image: postgres:16-alpine
    container_name: vantage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vantage}
      POSTGRES_DB: ${POSTGRES_DB:-vantage}
    ports:
      - "5432:5432"
    volumes:
      - vantage-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantage}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vantage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vantage-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vantage-pg-data:
  vantage-redis-data:
