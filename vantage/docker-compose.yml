services:
  postgres:
    image: postgres:16-alpine
    container_name: vantage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vantage}
      POSTGRES_DB: ${POSTGRES_DB:-vantage}
    ports:
      # Host port 5434 (not 5432) avoids colliding with other local Postgres
      # containers; override with POSTGRES_HOST_PORT. Container port stays 5432.
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - vantage-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantage}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vantage-redis
    restart: unless-stopped
    ports:
      # Host port 6381 (not 6379) avoids colliding with other local Redis
      # containers; override with REDIS_HOST_PORT. Container port stays 6379.
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - vantage-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vantage-pg-data:
  vantage-redis-data:
